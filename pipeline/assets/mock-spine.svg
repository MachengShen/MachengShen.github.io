<svg xmlns="http://www.w3.org/2000/svg" width="920" height="540" viewBox="0 0 920 540" role="img" aria-label="Synthetic mockup: public spine architecture page">
  <defs>
    <style>
      .t{font-family:Georgia,"Times New Roman",serif}
      .ui{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    </style>
  </defs>
  <rect width="920" height="540" fill="#e8e2d6"/>
  <rect x="70" y="28" width="780" height="484" rx="10" fill="#f7f4ef" stroke="#d9d2c5"/>
  <rect x="70" y="28" width="780" height="42" fill="#fff" stroke="#d9d2c5"/>
  <circle cx="94" cy="49" r="6" fill="#ff5f57"/>
  <circle cx="114" cy="49" r="6" fill="#febc2e"/>
