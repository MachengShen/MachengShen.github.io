  <text class="mono" x="170" y="54" fill="#555" font-size="12">machengshen.github.io/spine/</text>
  <text class="ui" x="700" y="54" fill="#888" font-size="11">synthetic UI</text>

  <text class="t" x="110" y="120" fill="#1a1a1a" font-size="28" font-weight="700">A spine for multi-agent work</text>
  <text class="ui" x="110" y="148" fill="#555" font-size="13">Public architecture page · agent-readable · human-skimmable</text>

  <rect x="110" y="176" width="340" height="110" rx="10" fill="#fff" stroke="#d9d2c5"/>
  <text class="ui" x="128" y="204" fill="#2c5f4a" font-size="11" font-weight="700">CLAIM 1 · SHARED MEMORY HUB</text>
  <text class="t" x="128" y="232" fill="#1a1a1a" font-size="15">Durable standing prefs across agents</text>
  <text class="ui" x="128" y="258" fill="#555" font-size="12">Not chat history alone</text>

  <rect x="470" y="176" width="340" height="110" rx="10" fill="#fff" stroke="#d9d2c5"/>
