  <text class="ui" x="128" y="340" fill="#2c5f4a" font-size="12" font-weight="700">WHY THIS PAGE EXISTS IN THE DAY PIPELINE</text>
  <text class="t" x="128" y="372" fill="#1a1a1a" font-size="15">When someone asks “how is the stack shaped?”, point here first.</text>
